name: TaskLock v5 Windows Installer and Release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a public v5.0.0 beta installer after Windows testing'
        type: boolean
        required: true
        default: false
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and test requirements
        run: python -m pip install --upgrade pip pyinstaller pytest
      - name: Run unit tests on Windows
        run: python -m pytest tests -q
      - name: Verify source compiles
        run: python -m compileall -q app
      - name: Embed public GitHub release source
        shell: pwsh
        run: |
          $cfg = @{github_repository = '${{ github.repository }}'} | ConvertTo-Json
          Set-Content -Path app/release_config.json -Value $cfg -Encoding utf8
      - name: Build portable Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TaskLock --icon assets/tasklock.ico --add-data "assets/tasklock.png;assets" --add-data "app/release_config.json;app" --paths app app/TaskLock.py
          if (!(Test-Path dist/TaskLock.exe)) { throw 'EXE missing' }
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "installer\TaskLock.iss"
          if (!(Test-Path release/TaskLock-v5.0.0-Setup.exe)) { throw 'Installer missing' }
      - name: Package portable app and extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item dist/TaskLock.exe portable/TaskLock.exe
          Copy-Item Browser_Extension portable/Browser_Extension -Recurse
          Copy-Item README.md, CHANGELOG.md, LICENSE portable/
          Compress-Archive -Path portable/* -DestinationPath release/TaskLock-v5.0.0-Windows.zip -Force
      - name: Compute release manifest and checksums
        run: python tools/make_release_manifest.py --repo "${{ github.repository }}" --folder release
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskLock-v5-Windows
          path: release/*
      - name: Publish official release on version tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'v5.0.0-beta.1' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event_name == 'workflow_dispatch' && 'TaskLock v5.0.0 BLUECORE Beta 1' || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-') }}
          files: release/*
          body_path: CHANGELOG.md
          generate_release_notes: true
