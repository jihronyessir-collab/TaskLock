name: Wolfveil Prototype Tests
on:
  push:
    branches: ['main']
    paths:
      - 'projects/wolfveil/**'
      - 'tests/test_wolfveil.py'
      - '.github/workflows/wolfveil-tests.yml'
  pull_request:
    paths:
      - 'projects/wolfveil/**'
      - 'tests/test_wolfveil.py'
      - '.github/workflows/wolfveil-tests.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run Wolfveil unit and security tests
        run: python -m pytest tests/test_wolfveil.py -q
      - name: Compile Wolfveil sources
        run: python -m compileall -q projects/wolfveil/wolfveil
